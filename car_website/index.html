<!DOCTYPE html>
<html>
<head>
    <title>Car Registration system</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Car Registration system</h1>
    <p>Register your car below.</p>

    <h2>Enter Car Details</h2>
    <p>Please provide your car information</p>

<form action="/register" method="POST">
    <label for="brand">Brand</label><br>
    <input type="text" id="brand" name="brand" placeholder="Enter car brand" required><br>

    <label for="model">Model</label><br>
    <input type="text" id="model" name="model" placeholder="Enter car model" required><br>

    <label for="year">Year</label><br>
    <input type="number" id="year" name="year" placeholder="Enter car year" required><br>

    <label for="car_type">Car Type</label><br>
    <select id="car_type" name="car_type">
        <option>Sedan</option>
        <option>SUV</option>
        <option>Truck</option>
        <option>Coupe</option>
    </select><br>
    <button>Register Car</button>
</form>
</body>
</html>
